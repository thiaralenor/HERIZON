[project]
name = "health-platform-backend"
version = "0.1.0"
description = "FastAPI backend for Health Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "supabase>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
